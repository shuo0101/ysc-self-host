name: Daily TVBox Live Sources Update

"on":
  schedule:
    - cron: '0 16 * * *'   # UTC 16:00 = 北京时间 00:00，每天
  workflow_dispatch:        # 允许手动触发

permissions:
  contents: write

jobs:
  aggregate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -i https://pypi.tuna.tsinghua.edu.cn/simple

      # 兜底：EPG 是聚合器的依赖，失败时退化为 CDN 缓存，不阻断流程
      - name: Download EPG (fallback)
        continue-on-error: true
        run: |
          mkdir -p output
          curl -L --retry 3 --max-time 120 \
            "https://cdn.jsdelivr.net/gh/BurningC4/Chinese-IPTV@master/guide.xml" \
            -o output/epg.xml || true

      - name: Run live aggregator
        run: python aggregator.py --live
        env:
          PYTHONWARNINGS: default

      # 防止提交空文件 / 损坏的 JSON
      - name: Verify outputs
        run: |
          for f in output/tvbox.json output/live.txt output/live.m3u output/live_config.json; do
            if [ ! -s "$f" ]; then
              echo "❌ $f 为空或不存在"
              exit 1
            fi
          done
          python -c "import json;json.load(open('output/tvbox.json'))" || (echo "❌ tvbox.json 不是合法 JSON" && exit 1)

      - name: Commit & Push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/ sources_cache/
          git diff --cached --quiet && echo "无变更，跳过提交" || \
            (git commit -m "chore: auto update live sources [skip ci]" && git push)

      - name: Notify on failure
        if: failure()
        run: echo "::error::直播源聚合失败，请查看上方日志"
