# .github/workflows/probe-baoer.yml（一次性，跑完可删）
name: 测 baoer 可达性
'on': workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          python3 - <<'EOF'
          import urllib.request, ssl, gzip, re
          from datetime import datetime, timedelta, timezone
          ctx = ssl.create_default_context()
          ctx.check_hostname=False; ctx.verify_mode=ssl.CERT_NONE
          TZ8 = timezone(timedelta(hours=8))
          now = datetime.now(TZ8).strftime('%Y%m%d')
          for url in ["https://baoer.org.cn/e.xml.gz","https://baoer.org.cn/e.xml",
                      "https://baoer.org.cn/x.xml.gz","https://baoer.org.cn/x.xml"]:
              try:
                  req = urllib.request.Request(url, headers={"User-Agent":"Mozilla/5.0 (Windows NT 10.0; Win64; x64)"})
                  with urllib.request.urlopen(req, timeout=30, context=ctx) as r:
                      raw = r.read()
                  text = gzip.decompress(raw).decode('utf-8','ignore') if url.endswith('.gz') else raw.decode('utf-8','ignore')
                  dates = re.findall(r'start="(\d{14})', text)
                  latest = max(dates)[:8] if dates else "无"
                  ch = len(set(re.findall(r'channel id="([^"]+)"', text)))
                  print(f"✅ {url:<34} {len(text):>9}字节 {ch:>4}频道 {len(dates):>5}节目 最新{latest} {'🟢' if latest>=now else '🔴'}")
              except Exception as e:
                  print(f"❌ {url:<34} {str(e)[:36]}")
          EOF
