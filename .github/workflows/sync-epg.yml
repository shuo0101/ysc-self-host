name: 每日 EPG 同步

'on':
  schedule:
    - cron: '40 18 * * *'   # 北京时间 02:40，对齐 baoer 凌晨30分更新
  workflow_dispatch:

permissions:
  contents: write

# 串行锁：同一时刻只允许一个 workflow 运行，避免并发提交冲突
concurrency:
  group: epg-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 抓取 EPG（baoer 主源 + zsdc 兜底）
        run: |
          python3 - <<'PY'
          import urllib.request, ssl, gzip, re, json, sys, os
          from datetime import datetime, timedelta, timezone

          ctx = ssl.create_default_context()
          ctx.check_hostname = False
          ctx.verify_mode = ssl.CERT_NONE
          TZ8 = timezone(timedelta(hours=8))
          now = datetime.now(TZ8)
          today8 = now.strftime('%Y%m%d')
          headers = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"}

          raw = None
          for url in ["https://baoer.org.cn/e.xml.gz"]:
              try:
                  req = urllib.request.Request(url, headers=headers)
                  with urllib.request.urlopen(req, timeout=60, context=ctx) as r:
                      raw = r.read()
                  print(f"📥 下载: {url} → {len(raw)} 字节")
                  break
              except Exception as e:
                  print(f"❌ {url}: {e}")

          if not raw:
              print("⚠️ baoer 失败，尝试 zsdc 兜底")
              try:
                  req = urllib.request.Request("https://epg.zsdc.eu.org/t.xml.gz", headers=headers)
                  with urllib.request.urlopen(req, timeout=60, context=ctx) as r:
                      text = gzip.decompress(r.read()).decode('utf-8', 'ignore')
                  print(f"📥 zsdc 兜底下载成功 → {len(text)} 字符")
              except Exception as e:
                  print(f"❌ zsdc 兜底也失败: {e}")
                  sys.exit(1)
          else:
              try:
                  text = gzip.decompress(raw).decode('utf-8', 'ignore')
                  print(f"✅ 解压完成 → {len(text)} 字符")
              except Exception as e:
                  print(f"❌ 解压失败: {e}")
                  sys.exit(1)

          channels = re.findall(r'<channel id="([^"]+)"', text)
          names = {}
          for m in re.finditer(r'<channel id="([^"]+)">(.*?)</channel>', text, re.S):
              nm = re.search(r'<display-name[^>]*>([^<]+)</display-name>', m.group(2))
              if nm:
                  names[m.group(1)] = nm.group(1)
          programmes = re.findall(r'<programme\b[^>]*>.*?</programme>', text, re.S)
          dates = re.findall(r'<programme[^>]*start="(\d{14})"', text)
          latest = max(dates)[:8] if dates else "无"
          print(f"✅ 解析: {len(channels)} 频道 / {len(programmes)} 节目, 最新日期 {latest}")

          if not channels:
              print("❌ 无任何频道，退出")
              sys.exit(1)

          cutoff_past = now - timedelta(hours=6)
          cutoff_future = now + timedelta(days=3)
          kept, dropped_past, dropped_future = [], 0, 0
          for p in programmes:
              ms = re.search(r'start="(\d{14})"', p)
              me = re.search(r'stop="(\d{14})"', p)
              start = datetime.strptime(ms.group(1), '%Y%m%d%H%M%S').replace(tzinfo=TZ8) if ms else None
              end = datetime.strptime(me.group(1), '%Y%m%d%H%M%S').replace(tzinfo=TZ8) if me else None
              if start and start > cutoff_future:
                  dropped_future += 1
                  continue
              if end and end < cutoff_past:
                  dropped_past += 1
                  continue
              kept.append(p)
          ch_with_prog = set()
          for p in kept:
              mc = re.search(r'channel="([^"]+)"', p)
              if mc:
                  ch_with_prog.add(mc.group(1))
          kept_channels = [c for c in channels if c in ch_with_prog]
          print(f"🕒 时间过滤: 保留 {len(kept)} 条, 丢弃过期 {dropped_past} 条, 丢弃过远未来 {dropped_future} 条, 移除空频道 {len(channels)-len(kept_channels)} 个")

          if not kept:
              yest = (now - timedelta(days=1)).strftime('%Y%m%d')
              yest_path = os.path.join(os.getcwd(), 'output', f'epg-{yest}.xml')
              if os.path.exists(yest_path):
                  print(f"⚠️ 当日无数据，沿用昨日 {yest_path}")
                  sys.exit(0)
              print("❌ 过滤后无节目，且昨日无备份")
              sys.exit(1)

          xml = '<?xml version="1.0" encoding="UTF-8"?>\n<!DOCTYPE tv SYSTEM "xmltv.dtd">\n<tv generator-info-name="baoer.org.cn/zsdc">\n'
          for c in kept_channels:
              nm = names.get(c, c)
              xml += f'  <channel id="{c}"><display-name lang="zh">{nm}</display-name></channel>\n'
          xml += ''.join(kept) + '</tv>\n'

          out_dir = os.path.join(os.getcwd(), 'output')
          os.makedirs(out_dir, exist_ok=True)
          out_xml = os.path.join(out_dir, 'epg.xml')
          with open(out_xml, 'w', encoding='utf-8') as fh:
              fh.write(xml)
          print(f"✓ output/epg.xml: {len(kept_channels)} 频道 / {len(kept)} 节目")

          all_progs = []
          for p in programmes:
              mc = re.search(r'channel="([^"]+)"', p)
              ms = re.search(r'start="(\d{14})"', p)
              me = re.search(r'stop="(\d{14})"', p)
              mt = re.search(r'<title[^>]*>([^<]+)</title>', p)
              if mc and ms:
                  all_progs.append({
                      "channel": mc.group(1),
                      "start": ms.group(1),
                      "stop": me.group(1) if me else "",
                      "title": mt.group(1) if mt else "",
                  })
          json_path = os.path.join(out_dir, 'epg.json')
          with open(json_path, 'w', encoding='utf-8') as fh:
              json.dump({"channels": {c: names.get(c, c) for c in channels}, "programmes": all_progs}, fh, ensure_ascii=False, separators=(',', ':'))
          print(f"✓ output/epg.json: {len(channels)} 频道 / {len(all_progs)} 节目")

          dated = os.path.join(out_dir, f'epg-{today8}.xml')
          with open(dated, 'w', encoding='utf-8') as fh:
              fh.write(xml)
          print(f"✓ 已备份: {dated}")
          PY

      - name: 提交并推送
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config pull.rebase true
          # 关键：pull --autostash 自动贮藏未提交改动，rebase 后再弹出，避免 "cannot rebase" 报错
          git add output/epg.xml output/epg.json epg-*.xml 2>/dev/null || true
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
          if git diff --cached --quiet; then
            echo "无变更，跳过提交"
            exit 0
          fi
          git commit -m "chore: auto sync epg [skip ci]"
          for i in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && \
            git push origin "HEAD:${GITHUB_REF_NAME}" && break || sleep 5
          done
