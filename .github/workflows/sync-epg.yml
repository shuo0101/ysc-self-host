name: EPG 探路诊断
'on': workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir -p probe && cd probe
          git clone --depth 1 https://github.com/iptv-org/epg.git .
          npm ci >/dev/null 2>&1
          echo "########## 1. grab.ts --help ##########"
          node -r @swc-node/register scripts/commands/epg/grab.ts --help || true
          echo
          echo "########## 2. sites/ 前 20 个目录 ##########"
          ls sites/ | head -20
          echo
          echo "########## 3. sites/ 总数 ##########"
          ls sites/ | wc -l
          echo
          echo "########## 4. channels/ 前 20 个文件 ##########"
          ls channels/ | head -20
          echo
          echo "########## 5. 含 cn 的 channels ##########"
          ls channels/ | grep -i "\.cn\." | head -20 || echo "无匹配"
          echo
          echo "########## 6. 读一个 site 配置看 ID 字段 ##########"
          ls sites/ | head -1 | while read d; do
            echo "目录: $d"
            ls "sites/$d/" | head -5
            echo "--- config.js / config.ts 内容（前 30 行）---"
            head -30 "sites/$d"/*.ts "sites/$d"/*.js 2>/dev/null || true
          done
