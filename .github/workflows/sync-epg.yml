name: 每日 EPG 同步

on:
  schedule:
    - cron: '30 18 * * *'   # UTC 18:30 = 北京时间 02:30
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.repository }}-repo-update
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install aiohttp aiofiles pyyaml

      - name: 缓存 EPG 抓取缓存
        uses: actions/cache@v4
        with:
          path: epg_cache
          key: ${{ runner.os }}-epg-${{ github.run_number }}
          restore-keys: |
            ${{ runner.os }}-epg-

      - name: 同步 EPG
        run: python epg_sync.py
        continue-on-error: true
        env:
          EPG_DIR: output
          EPG_CACHE_DIR: epg_cache
          MAX_AGE_DAYS: 14
          EPG_FETCH_TIMEOUT: 60
          EPG_CONCURRENCY: 8

      - name: 提交并推送
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 先 stash 掉所有未提交改动（含未跟踪文件），保证后续 rebase 时 index 干净
          git stash push -u -m "auto-stash before rebase" || true
          git fetch origin "${GITHUB_REF_NAME}"
          if ! git rebase "origin/${GITHUB_REF_NAME}"; then
            echo "⚠️ rebase 冲突，放弃本次提交（等待下次 cron 重试）"
            git rebase --abort || true
            git stash pop 2>/dev/null || true
            exit 0
          fi
          # rebase 成功后恢复 stash 内容，再统一 add
          git stash pop 2>/dev/null || true
          [ -d output ] && git add output/ || true
          [ -d epg_cache ] && git add epg_cache/ || true
          if git diff --cached --quiet; then
            echo "无变更，跳过提交"
            exit 0
          fi
          git commit -m "chore: auto sync epg [skip ci]" && \
          (git push origin "HEAD:${GITHUB_REF_NAME}" || \
          (git fetch origin "${GITHUB_REF_NAME}" && \
          git rebase "origin/${GITHUB_REF_NAME}" && \
          git push origin "HEAD:${GITHUB_REF_NAME}")) || {
            echo "⚠️ push 失败，等待下次重试"
            exit 0
          }
