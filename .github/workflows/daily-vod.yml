name: Daily TVBox VOD Update (every 3 days)

"on":
  schedule:
    # UTC 时间。北京时间 = UTC+8，所以 UTC 16:00 = 北京时间 00:00
    # 用 cron 每 3 天触发一次：1 号、4 号、7 号、10 号 ... 31 号
    - cron: '0 16 1-31/3 * *'   # 北京时间 00:00，每 3 天
  workflow_dispatch:

permissions:
  contents: write

jobs:
  aggregate-vod:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -i https://pypi.tuna.tsinghua.edu.cn/simple

      # 双保险：即使 cron 边界月有偏差，也保证"至少间隔 3 天"
      # 用文件记录上次实际更新日期，不足 3 天则跳过本次
      - name: Check 3-day interval
        id: interval
        run: |
          python - <<'PY'
          from pathlib import Path
          from datetime import date, datetime
          import os

          flag = Path('.vod_last_update')
          today = date.today()
          should_run = True

          if flag.exists():
              try:
                  last = date.fromisoformat(flag.read_text().strip())
                  days = (today - last).days
                  if days < 3:
                      print(f"距上次更新仅 {days} 天（<3），跳过本次")
                      should_run = False
                  else:
                      print(f"距上次更新 {days} 天，执行本次更新")
              except ValueError:
                  print("上次更新日期记录损坏，执行本次更新")

          if should_run:
              flag.write_text(today.isoformat())
              print(f"已记录更新日期: {today}")
          Path(os.environ['GITHUB_OUTPUT']).open('a').write(
              f"should_run={'true' if should_run else 'false'}\n"
          )
          PY

      - name: Run VOD aggregator
        if: steps.interval.outputs.should_run == 'true'
        run: python aggregator.py --vod
        env:
          PYTHONWARNINGS: default

      - name: Verify outputs
        if: steps.interval.outputs.should_run == 'true'
        run: |
          for f in output/tvbox.json; do
            if [ ! -s "$f" ]; then
              echo "❌ $f 为空或不存在"
              exit 1
            fi
          done
          python -c "import json;json.load(open('output/tvbox.json'))" || (echo "❌ tvbox.json 不是合法 JSON" && exit 1)

      - name: Commit & Push
        if: steps.interval.outputs.should_run == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/
          git diff --cached --quiet && echo "无变更，跳过提交" || \
            (git commit -m "chore: auto update VOD sources [skip ci]" && git push)

      - name: Skip notice
        if: steps.interval.outputs.should_run == 'false'
        run: |
          echo "ℹ️ 点播源 3 天内已更新过，本次跳过（下个触发点再执行）"
          echo "聚合任务仍由 daily-update.yml 负责直播源"

      - name: Notify on failure
        if: failure()
        run: echo "::error::点播源聚合失败，请查看上方日志"
