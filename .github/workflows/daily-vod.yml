name: 每日点播源更新

on:
  schedule:
    - cron: '0 19 * * *'   # UTC 19:00 = 北京时间次日 03:00，与直播源错峰
  workflow_dispatch:
    inputs:
      force:
        description: '强制全量更新（忽略时间戳间隔）'
        required: false
        default: 'false'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 检查时间戳是否需要更新
        id: ts
        run: |
          python scripts/aggregator_vod.py --check-ts --interval 3600 || echo "need_update=true" >> $GITHUB_OUTPUT

      - name: 执行聚合
        if: steps.ts.outputs.need_update == 'true' || github.event.inputs.force == 'true'
        run: python aggregator_vod.py --vod

      - name: 提交并推送
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          [ -d output ] && git add output/ || true

          if git diff --cached --quiet; then
            git reset
            echo "无变更，跳过提交"
            exit 0
          fi

          git fetch origin "${GITHUB_REF_NAME}"
          if ! git rebase "origin/${GITHUB_REF_NAME}"; then
            echo "⚠️ rebase 冲突，放弃本次提交（等待下次 cron 重试）"
            git rebase --abort || true
            exit 0
          fi

          git commit -m "chore: auto update vod sources [skip ci]" && \
          (git push origin "HEAD:${GITHUB_REF_NAME}" || \
            (git fetch origin "${GITHUB_REF_NAME}" && \
             git rebase "origin/${GITHUB_REF_NAME}" && \
             git push origin "HEAD:${GITHUB_REF_NAME}"))
