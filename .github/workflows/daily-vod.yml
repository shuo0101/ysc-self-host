name: 每日点播源更新

'on':
  schedule:
    - cron: '0 19 */3 * *'   # UTC 19:00 = 北京时间次日 03:00，每 3 天一次，与直播源错峰
  workflow_dispatch:
    inputs:
      force:
        description: '强制全量更新（忽略时间戳间隔）'
        required: false
        default: 'false'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 检查时间戳是否需要更新
        id: ts
        run: |
          # 上次成功执行的时间戳存在根目录的隐藏文件 .vod_last_update 中
          MARKER=".vod_last_update"
          INTERVAL=259200   # 与上次成功执行间隔不足 3 天（259200s）则跳过
          need_update="true"

          if [ -f "$MARKER" ] && [ "${{ github.event.inputs.force }}" != "true" ]; then
            last=$(cat "$MARKER" 2>/dev/null || echo 0)
            now=$(date +%s)
            if [ $((now - last)) -lt "$INTERVAL" ]; then
              need_update="false"
              echo "距上次成功执行不足 3 天（$(( (now - last) / 3600 ))h），跳过本次聚合"
            fi
          fi

          echo "need_update=$need_update" >> $GITHUB_OUTPUT

      - name: 执行聚合
        if: steps.ts.outputs.need_update == 'true'
        run: python aggregator.py --vod

      - name: 提交并推送
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          [ -d output ] && git add output/ || true
          # 仅在本次确实产生了产物变更时刷新时间戳，失败运行不重置间隔
          if ! git diff --cached --quiet; then
            date +%s > .vod_last_update
          fi
          # 时间戳文件必须在 commit 覆盖范围内，保证随每次成功执行推进
          [ -f .vod_last_update ] && git add .vod_last_update || true

          if git diff --cached --quiet; then
            git reset
            echo "无变更，跳过提交"
            exit 0
          fi

          # 有变更：先把暂存内容 stash 起来，保证 rebase 时 index 干净
          git fetch origin "${GITHUB_REF_NAME}"

          if ! git stash push -u -m "pre-rebase-$(date +%s)"; then
            echo "stash 失败，放弃本次提交"
            exit 0
          fi

          if ! git rebase "origin/${GITHUB_REF_NAME}"; then
            echo "⚠️ rebase 冲突，放弃本次提交（等待下次 cron 重试）"
            git rebase --abort || true
            git stash pop || true
            exit 0
          fi

          # rebase 成功，恢复暂存内容，并重新 add 被 stash 带走的产物
          git stash pop || true
          [ -d output ] && git add output/ || true
          [ -f .vod_last_update ] && git add .vod_last_update || true

          if git commit -m "chore: auto update vod sources [skip ci]"; then
            if ! git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "首次 push 失败，重新 fetch + rebase 后重试"
              git fetch origin "${GITHUB_REF_NAME}" && \
              git rebase "origin/${GITHUB_REF_NAME}" && \
              git push origin "HEAD:${GITHUB_REF_NAME}"
            fi
          fi
