name: Daily TVBox VOD Update (every 3 days)

"on":
  schedule:
    # UTC 时间。北京时间 = UTC+8，所以 UTC 18:00 = 北京时间 02:00
    # 每 3 天触发一次：以 3 为步长的固定日期，配合下方 flag 兜底真实间隔
    # 错开到北京时间 03:00，避开直播源与 EPG 的 02:00 并发抢写
    - cron: '0 19 */3 * *'  # 北京时间 03:00，每 3 天（1/4/7/...号）
  workflow_dispatch:

permissions:
  contents: write

jobs:
  aggregate-vod:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -i https://pypi.tuna.tsinghua.edu.cn/simple

      # 双保险：cron 的 */3 跨月时最后一次与下次可能不足 3 天，
      # 用 flag 文件记录上次真实运行时间，不足 3 天则跳过本次
      - name: Check 3-day interval
        id: interval
        run: |
          python - <<'PY'
          from pathlib import Path
          from time import time
          import os

          flag = Path('.vod_last_update')
          INTERVAL = 3 * 86400
          now = time()
          should_run = True

          if flag.exists():
              try:
                  last = float(flag.read_text().strip())
                  elapsed = now - last
                  if elapsed < INTERVAL:
                      print(f"距上次更新仅 {elapsed/3600:.1f} 小时（<72h），跳过本次")
                      should_run = False
                  else:
                      print(f"距上次更新 {elapsed/3600:.1f} 小时，执行本次更新")
              except ValueError:
                  print("上次更新时间记录损坏，执行本次更新")

          if should_run:
              flag.write_text(f"{now:.0f}")
              print("已记录本次更新时间")
          Path(os.environ['GITHUB_OUTPUT']).open('a').write(
              f"should_run={'true' if should_run else 'false'}\n"
          )
          PY

      - name: Run VOD aggregator
        if: steps.interval.outputs.should_run == 'true'
        run: python aggregator.py --vod
        env:
          PYTHONWARNINGS: default

      - name: Verify outputs
        if: steps.interval.outputs.should_run == 'true'
        run: |
          for f in output/tvbox.json; do
            if [ ! -s "$f" ]; then
              echo "❌ $f 为空或不存在"
              exit 1
            fi
          done
          python -c "import json;json.load(open('output/tvbox.json'))" || (echo "❌ tvbox.json 不是合法 JSON" && exit 1)

      - name: Commit & Push
        if: steps.interval.outputs.should_run == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          [ -d output ] && git add output/ || true
          [ -f .vod_last_update ] && git add .vod_last_update || true
          git diff --cached --quiet && echo "无变更，跳过提交" && exit 0

          # 先 fetch 再 rebase，避免与并发推送的工作流互相覆盖
          git fetch origin "${GITHUB_REF_NAME}"
          if ! git rebase "origin/${GITHUB_REF_NAME}"; then
            echo "⚠️ rebase 冲突，放弃本次提交（等待下次 cron 重试）"
            git rebase --abort || true
            exit 0
          fi

          git commit -m "chore: auto update VOD sources [skip ci]" && \
          (git push origin "HEAD:${GITHUB_REF_NAME}" || \
            (git fetch origin "${GITHUB_REF_NAME}" && \
             git rebase "origin/${GITHUB_REF_NAME}"" && \
             git push origin "HEAD:${GITHUB_REF_NAME}"))

      - name: Skip notice
        if: steps.interval.outputs.should_run == 'false'
        run: |
          echo "ℹ️ 点播源 3 天内已更新过，本次跳过（下个触发点再执行）"
          echo "聚合任务仍由 daily-update.yml 负责直播源"

      # 注意：failure() 只捕获到本步骤为止的失败状态。
      # 若把"Notify"放在最后，Verify 失败时 job 已在 Verify 处结束，
      # 这里的通知仍能触发，因为它 if: failure() 且自身命令简单不会失败。
      - name: Notify on failure
        if: failure()
        run: echo "::error::点播源聚合失败，请查看上方日志"
