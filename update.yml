name: 每日更新源

on:
  schedule:
    # 每天北京时间 06:00 和 18:00 自动更新
    - cron: '0 22 * * *'
    - cron: '0 10 * * *'
  workflow_dispatch:      # 允许手动触发
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: pip install requests

      - name: 更新点播源
        run: python scripts/vod_update.py

      - name: 更新直播源
        run: python scripts/live_update.py

      - name: 提交结果
        run: |
          git config user.name "tvbox-bot"
          git config user.email "tvbox-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "无变更，跳过提交"
          else
            git commit -m "auto: 更新源 $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi

      - name: 保留产物
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: output
          path: output/
          retention-days: 7
