# TVBox 自动聚合配置
# aggregator.py 会在启动时读取本文件并覆盖内置默认值

vod:
  timeout: 12              # 单源请求超时（秒）
  concurrency: 15          # 并发连接数
  min_json_size: 200       # 视为有效 JSON 的最小字节数
  max_sources: 1500        # 最多保留的点播源数量
  discover_per_page: 20    # GitHub Search 每页结果数

live:
  timeout: 8               # HEAD 探测超时（秒）
  probe_timeout: 6         # ffprobe 探测超时（秒）
  concurrency: 10          # 并发连接数
  min_resolution: 720      # 最低分辨率，低于此值丢弃（720/1080/2160）
  max_channels: 1500       # 最多保留的频道数量
  urls_per_channel: 6      # 每个频道保留的线路数
  sort_weights:            # 线路评分权重，须加和为 1
    resolution: 0.40
    speed: 0.30
    delay: 0.20
    stability: 0.10

logo:
  base_url: "https://live.fanmingming.com/tv"   # 台标基地址

discover:
  # 点播源种子列表，GitHub Search 失败时的兜底
  vod_seeds:
    - "https://gh-proxy.com/https://raw.githubusercontent.com/jifeng250/tvbox-sources/main/urls.json"
    - "https://gh-proxy.com/https://raw.githubusercontent.com/wzh15802/tvbox/main/tv.json"
  # 直播源种子列表
  live_seeds:
    - "https://cdn.jsdelivr.net/gh/Lightconer/TVBox-Sources@main/output/live.txt"
    - "https://cdn.jsdelivr.net/gh/Lightconer/TVBox-Sources@main/output/live.m3u"

epg:
  # 电子节目单下载地址（sync-epg.yml 使用）
  primary: "https://cdn.jsdelivr.net/gh/BurningC4/Chinese-IPTV@master/guide.xml"
  backups:
    - "https://live.fanmingming.com/e.xml"
    - "https://epg.112114.xyz/pp.xml"
