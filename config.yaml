# ============================================================
#  TVBox 影视仓 聚合配置
#  github: shuo0101/ysc-self-host
#  对应 aggregator.py v8.16
# ============================================================
# ── 台标基础地址 ──
logo:
  base_url: "https://live.fanmingming.com/tv"

# ============================================================
#  点播源
# ============================================================
vod:
  timeout: 12              # 单源请求超时（秒）
  concurrency: 100          # 并发连接数
  min_json_size: 200       # 视为有效 JSON 的最小字节数
  max_sources: 1500        # 最多保留的点播源数量
  discover_per_page: 20    # GitHub Search 每页结果数

# ============================================================
#  直播源
# ============================================================
live:
# ═══════════════════════════════════════════════════════════
# 探测策略：两阶段 · 国内源先测 · 每频道探测封顶 · 按画质配额保留
#
#   阶段一：抓取全部源 → 全局 URL 去重 → 按频道归一化分组
#   阶段二：每频道最多取 probe.candidate_pool.max（20）条候选，
#           国内源排最前先测；探测通过的线路按画质配额保留：
#             4K×4 + 1080p×5 + 720p×3 = 12 条（见 live.res_quotas）
#           某档线路不够时，用其它画质补齐，总数不超过 12。
# ═══════════════════════════════════════════════════════════

  # ── 第 1 组：官方/长期静态源（无需鉴权，固定直链）──
  urls_static:
    # 浙江系（1080p）
    - "https://ali-m-l.cztv.com/channels/lantian/channel002/1080p.m3u8"
    - "https://ali-m-l.cztv.com/channels/lantian/channel003/1080p.m3u8"
    - "https://ali-m-l.cztv.com/channels/lantian/channel004/1080p.m3u8"
    - "https://ali-m-l.cztv.com/channels/lantian/channel006/1080p.m3u8"
    - "https://ali-m-l.cztv.com/channels/lantian/channel007/1080p.m3u8"
    - "https://ali-m-l.cztv.com/channels/lantian/channel008/1080p.m3u8"
    - "https://ali-m-l.cztv.com/channels/lantian/channel010/1080p.m3u8"
    - "https://ali-m-l.cztv.com/channels/lantian/channel011/1080p.m3u8"
    - "https://ali-m-l.cztv.com/channels/lantian/channel012/1080p.m3u8"
    # zdbs
    - "https://raw.githubusercontent.com/vbskycn/iptv/refs/heads/master/tv/iptv4.m3u"
    - "https://raw.githubusercontent.com/vbskycn/iptv/refs/heads/master/tv/iptv4.txt"
    # Gitee c-coming/mytv（个人维护，主力是 mytv2.txt）
    - "https://gitee.com/c-coming/mytv/raw/master/mytv2.txt"
    - "https://gitee.com/c-coming/mytv/raw/master/mytv.txt"
    - "https://gitee.com/c-coming/mytv/raw/master/IPTV.txt"
    # Gitee scljy/mytv（联通/四川联通源，国内直连）
    - "https://gitee.com/scljy/mytv/raw/master/%E5%9B%BD%E5%86%85%E7%94%B5%E8%A7%86%E7%9B%B4%E6%92%AD%E6%BA%90.m3u"
    - "https://gitee.com/scljy/mytv/raw/master/beijing_unicom_new.txt"
    - "https://gitee.com/scljy/mytv/raw/master/SCLT1018.m3u"
    - "https://gitee.com/scljy/mytv/raw/master/sc-unicom01.m3u"
    - "https://gitee.com/scljy/mytv/raw/master/sclt-iptv.m3u8"

    # epg.pw / 8.138.7.223（同一站，WAF 拦非浏览器请求）
    - "https://epg.pw/test_channels.m3u"
    - "http://8.138.7.223/live.txt"
    - "https://fs-im-kefu.7moor-fs1.com/ly/4d2c3f00-7d4c-11e5-af15-41bf63ae4ea0/1715581924111/live1.txt"
    # 4K / 纯享
    - "https://event.pull.hebtv.com:443/live/live101.m3u8"
    - "https://livepull-tcms.sztv.com.cn/live/sz4Kpgm.m3u8"
    - "https://raw.bgithub.xyz/Ftindy/IPTV-URL/main/IPTV.m3u"
    # 省级官方 HLS（1080p）
    - "https://test1.live.sdetv.com.cn/live/dianshizhibo/playlist.m3u8"
    - "http://bp-resource-dfl.bestv.cn/155/3/video.m3u8"    # 港澳静态源
    - "http://live4.tdm.com.mo:80/ch1/_definst_/ch1.live/playlist.m3u8"
    - "http://zhibo.hkstv.tv/livestream/mutfysrq/playlist.m3u8"
    # 当前活跃的公开聚合站
    - "https://live.fanmingming.com/tv/m3u/ipv4.m3u"
    - "https://live.fanmingming.com/tv/m3u/cctv.m3u"
    - "https://gh-proxy.com/https://raw.githubusercontent.com/Guovin/iptv-api/gd/output/result.m3u"
    - "https://gh-proxy.com/https://raw.githubusercontent.com/Guovin/iptv-api/gd/output/stable.m3u"
    - "https://cdn.jsdelivr.net/gh/Lightconer/TVBox-Sources@main/output/live.txt"
    - "https://cdn.jsdelivr.net/gh/Lightconer/TVBox-Sources@main/output/live.m3u"
    - "https://iptv-org.github.io/iptv/countries/cn.m3u"
    - "https://iptv-org.github.io/iptv/countries/hk.m3u"
    - "https://iptv-org.github.io/iptv/categories/china.m3u"
    # IPv6 兜底
    - "https://live.fanmingming.com/tv/m3u/ipv6.m3u"
    - "https://raw.githubusercontent.com/hwansong/ipv6tv/main/iptv6.m3u"

  # ── 第 2 组：静态源里「可能出 4K」的 ──
  urls_static_4k:
    - "https://dxtx.hntv.tv/live/lypd.m3u8"
    - "https://event.pull.hebtv.com/jishi/cp1.m3u8"
    - "https://event.pull.hebtv.com/jishi/cp2.m3u8"

  # ── 第 3 组：需刷新源（带签名/鉴权，会过期）──
  urls_refresh:
    - "https://dxtx.hntv.tv/live/lypd.m3u8"
    - "https://event.pull.hebtv.com/jishi/cp1.m3u8"
    - "https://event.pull.hebtv.com/jishi/cp2.m3u8"

  # ── 第 4 组：成都/四川电信 IPTV（zsdc 单播源，配套回看+时移）──
  # 来源：https://iptv.zsdc.eu.org
  # 说明：单播源支持时移/回看，配套电子节目单见下方 epg.primary
  # 注意：仅限电信网络内可用，非电信网络可能受限
  urls_zsdc:
    - "https://iptv.zsdc.eu.org/home/iptv.m3u8"        # 标准版
    - "https://iptv.zsdc.eu.org/home/apt_iptv.m3u8"   # APTV 兼容版

  # ── 第 5 组：本地源目录（自动扫描）──
  # 说明：把直播清单（.txt / .m3u / .m3u8）放到此目录，
  #       aggregator 启动时自动加载，无需逐个配置 URL。
  # 文件名自动识别类型（不区分大小写）：
  #   含 4k / 8k / ultra / uhd → 走 4K 候选轮次
  #   含 refresh / 刷新 / 鉴权 / 签名 / 过期 → 走需刷新轮次
  #   其余 → 静态源（固定直链，国内源加分）
  # 目录内优先级：文件越多越靠后加入，保持可预测顺序
  local_dir: "inputs"

  # ── 清晰度配额：每频道各保留多少路（main 主 + backup 备）──
  # 2160 → 4K 频道；1080 → 1080p；720 → 720p
  # 合计上限 = main + backup = 12 路
  # 晚高峰 4K×4 + 1080p×5 + 720p×3 = 12
  # 白天   4K×4 + 1080p×5 + 720p×3 = 12
  res_quotas:
    2160: 4        # 4K 频道主线路
    1080: 5        # 1080p 主线路
    720: 3         # 720p 备用线路

  # 晚高峰专用配额（不设则沿用 res_quotas）
  # res_quotas_peak:
  #   2160: 4
  #   1080: 5
  #   720: 3

  # 晚高峰时段（小时，24 制），hit 后用 res_quotas_peak
  peak_hours: [19, 20, 21, 22, 23]

  # ── 国内源加分 / 海外源降权（缓解晚间卡顿）──
  domestic_bonus: 15
  overseas_penalty: -15

  # ── 缓存 ─────────────────────────────────────────────
  # 源内容缓存：抓取到的 m3u/txt 落盘，TTL 内不再重复下载
  use_cache: true
  source_cache_ttl_seconds: 43200   # 12 小时（URL 不变，内容变化慢）
  # 探测结果缓存：TTL 内且历史稳定（命中率≥50%）的线路不再探
  probe_cache: true
  probe_cache_ttl_seconds: 600      # 10 分钟
  history_window: 20                # 每条线路保留最近 20 次探测结果

  # ── 探测参数 ──
  db_path: "data/sources.db"
  timeout: 8               # HEAD 探测超时（秒）
  probe_timeout: 6         # ffprobe 探测超时（秒）
  concurrency: 15          # 探测并发（平板实测 50 丢包多，降到 15）
  source_concurrency: 8    # 阶段一同时抓几个源（原来串行，一个超时源卡 6 分钟）
  min_resolution: 720      # 最低分辨率，低于此值丢弃
  max_channels: 1000       # 最多保留的频道数量
  cache_dir: "sources_cache"    # 内容缓存 + probe_cache.json 都放这里
  fetch_timeout: 20        # 单次拉取超时（秒），直连 1 次 + 1 次重试
  static_res_bonus: 5
  stability_window: 10

  # ── v9.0 抓取阶段：去重 + 上限控制 ──
  # 全局 URL 去重：同一 URL 在不同源里出现多次时只保留首次
  url_dedup: true
  # 抓取阶段最多保留频道数（按条目数排序，0=不限）
  max_fetch_channels: 0
  # 抓取阶段最多保留条目数（0=不限），超出后截断（去重之后生效）
  max_fetch_urls: 0

  # 以下参数已废弃（代码不读取），仅为兼容旧配置保留
  per_candidate_timeout: 8
  connect_timeout: 4
  max_candidates: 1
  proxies: []
  jsdelivr_hosts: []

  # ── 排序权重 ──
  sort_weights:
    resolution: 0.45
    speed: 0.15
    delay: 0.15
    stability: 0.25

# ============================================================
#  探测参数
# ============================================================
probe:
  # ── 探测候选池 ──
  # 每频道送入探测的候选线路数：min 起步，max 封顶
  # 国内源排在最前先测，达标后多余的不测，省 Actions 时长
  candidate_pool:
    min: 10
    max: 20          # 每频道最多探测 20 条

# ============================================================
#  点播源发现
# ============================================================
discover:
  vod_seeds:
    # 用 jsdelivr CDN 代理（国内可访问）
    - "https://cdn.jsdelivr.net/gh/jifeng250/tvbox-sources@main/urls.json"
    - "https://cdn.jsdelivr.net/gh/wzh15802/tvbox@main/tv.json"

# ============================================================
#  电子节目单（EPG）
#  来源：https://epg.zsdc.eu.org  —— zsdc 配套节目单
#  说明：7 天回看 + 5 天预告，每日更新 ≥2 次
#  注意：此 EPG 与上方 live.urls_zsdc 直播源为配套设计，
#        请保持两者来自同一项目，避免频道 ID 错配。
# ============================================================
epg:
  primary: "https://epg.zsdc.eu.org/t.xml.gz"
  backups:
    - "https://baoer.org.cn/e.xml.gz"
    - "https://live.fanmingming.com/e.xml"
    - "https://cdn.jsdelivr.net/gh/BurningC4/Chinese-IPTV@master/guide.xml"
